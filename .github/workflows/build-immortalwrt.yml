name: Build ImmortalWrt for 360T7 (Both Versions)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version:
          - name: openwrt-interface
            wifi-tool: mtwifi-cfg
          - name: mediatek-interface
            wifi-tool: luci-app-mtk

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Clone ImmortalWrt MT798x repository
      run: |
        git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git openwrt

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy base config for MT7981
      run: |
        cd openwrt
        cp -f defconfig/mt7981-ax3000.config .config

    - name: Apply WiFi tool specific config
      run: |
        cd openwrt
        if [ "${{ matrix.version.wifi-tool }}" = "mtwifi-cfg" ]; then
          echo "CONFIG_PACKAGE_luci-app-mtwifi-cfg=y" >> .config
          echo "CONFIG_PACKAGE_mtwifi-cfg=y" >> .config
          echo "# CONFIG_PACKAGE_luci-app-mtk is not set" >> .config
        else
          echo "CONFIG_PACKAGE_luci-app-mtk=y" >> .config
          echo "# CONFIG_PACKAGE_luci-app-mtwifi-cfg is not set" >> .config
          echo "# CONFIG_PACKAGE_mtwifi-cfg is not set" >> .config
        fi

    - name: Fix known issues
      run: |
        cd openwrt
        echo "# CONFIG_PACKAGE_kmod-ipt-offload is not set" >> .config
        echo "# CONFIG_PACKAGE_shortcut-fe is not set" >> .config
        echo "CONFIG_MTK_HNAT_PPE_THRESHOLD=30" >> .config

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ccache-${{ matrix.version.name }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ matrix.version.name }}-${{ github.ref }}-
          ccache-${{ matrix.version.name }}-

    - name: Download all sources
      run: |
        cd openwrt
        make defconfig
        make download -j8

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-${{ matrix.version.name }}-360t7
        path: |
          openwrt/bin/targets/mediatek/mt7981/*.bin
          openwrt/bin/targets/mediatek/mt7981/*.itb
        retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: build
    if: success()
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List all files
      run: ls -la artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: ImmortalWrt 360T7 - Build ${{ github.run_number }}
        tag_name: build-${{ github.run_number }}
        files: |
          artifacts/**/*.bin
          artifacts/**/*.itb
        fail_on_unmatched_files: false
